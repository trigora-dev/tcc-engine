[package]
name = "tcc-rust-frontend"
version = "26.10.2"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/trigora-dev/tcc-engine"
description = "Rust subset frontend."

[[bin]]
name = "tcc-rust-compile"
path = "src/bin/tcc-rust-compile.rs"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
tcc-ir = { version = "26.10.2", path = "../../crates/tcc-ir" }

[dev-dependencies]
tcc-core = { version = "26.10.2", path = "../../crates/tcc-core" }
tcc-state = { version = "26.10.2", path = "../../crates/tcc-state" }
