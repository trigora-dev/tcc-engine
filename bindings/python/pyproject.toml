[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "tcc-engine"
version = "26.10.0"
description = "TCC compiler frontend and native Python engine embedding"
requires-python = ">=3.9"

[tool.maturin]
manifest-path = "../../crates/tcc-python/Cargo.toml"
module-name = "tcc_engine._engine"
python-source = "python"
include = ["python/tcc_engine/_licenses/*", "python/tcc_engine/_licenses/**/*"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"
skip = "pp* *-win32 *-musllinux_*"
build-frontend = "build"

[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal && . \"$HOME/.cargo/env\" && bash ../../scripts/licenses/prepare-wheel.sh"
environment = { PATH = "$HOME/.cargo/bin:$PATH", CARGO_TERM_COLOR = "always" }

[tool.cibuildwheel.macos]
before-all = "bash ../../scripts/licenses/prepare-wheel.sh"

[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0", _PYTHON_HOST_PLATFORM = "macosx-11.0-arm64" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0", _PYTHON_HOST_PLATFORM = "macosx-11.0-x86_64" }

[tool.cibuildwheel.windows]
before-all = "bash ../../scripts/licenses/prepare-wheel.sh"
