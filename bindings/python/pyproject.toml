[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "tcc-engine"
version = "0.1.0-rc.1"
description = "TCC compiler frontend and native Python engine embedding"
requires-python = ">=3.9"

[tool.maturin]
manifest-path = "../../crates/tcc-python/Cargo.toml"
module-name = "tcc_engine._engine"
python-source = "python"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"
skip = "pp* *-win32 *-musllinux_*"
build-frontend = "build"

[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH", CARGO_TERM_COLOR = "always" }
