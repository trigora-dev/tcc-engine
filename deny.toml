[licenses]
version = 2
unused-allowed-license = "allow"
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
]
exceptions = [
    { allow = ["BUSL-1.1"], crate = "tcc-core" },
    { allow = ["BUSL-1.1"], crate = "tcc-host" },
    { allow = ["BUSL-1.1"], crate = "tcc-host-sqlite" },
    { allow = ["BUSL-1.1"], crate = "tcc-ir" },
    { allow = ["BUSL-1.1"], crate = "tcc-rust-frontend" },
    { allow = ["BUSL-1.1"], crate = "tcc-state" },
    # pyo3's build script only. Apache-2.0 WITH LLVM-exception is not linked into the wheel or the wasm package.
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "target-lexicon" },
]

[licenses.private]
ignore = true

[graph]
exclude-dev = true
