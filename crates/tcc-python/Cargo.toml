[package]
name = "tcc-python"
version = "26.10.0"
edition = "2021"
publish = false
description = "Native Python binding for the TCC core"

[lib]
name = "_engine"
crate-type = ["cdylib"]

[build-dependencies]
pyo3-build-config = "0.23"

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
tcc-core = { path = "../tcc-core" }
tcc-ir = { path = "../tcc-ir" }
tcc-state = { path = "../tcc-state" }
