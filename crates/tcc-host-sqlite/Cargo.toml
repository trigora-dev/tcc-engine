[package]
name = "tcc-host-sqlite"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/trigora-dev/tcc-engine"
description = "SQLite host for TCC executions"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tcc-core = { version = "0.1.0", path = "../tcc-core" }
tcc-host = { version = "0.1.0", path = "../tcc-host" }
tcc-ir = { version = "0.1.0", path = "../tcc-ir" }
tcc-state = { version = "0.1.0", path = "../tcc-state" }

[[bin]]
name = "tcc-host-sqlite"
path = "src/bin/worker.rs"
