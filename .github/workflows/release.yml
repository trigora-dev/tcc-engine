name: release

on:
  push:
    tags: ["v26.10.4"]

jobs:
  package:
    uses: ./.github/workflows/package.yml

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: tcc-engine-26.10.4
          path: dist-packages
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          set -euo pipefail
          publish() {
            local name="$1"
            local attempt=1
            local output status
            while true; do
              set +e
              output=$(cargo publish -p "$name" 2>&1)
              status=$?
              set -e
              printf '%s\n' "$output"
              if [ "$status" -eq 0 ]; then
                return 0
              fi
              if printf '%s\n' "$output" | grep -Eiq 'already exists|already uploaded'; then
                return 0
              fi
              if ! printf '%s\n' "$output" | grep -Eiq 'failed to select a version|no matching package named'; then
                return "$status"
              fi
              if [ "$attempt" -ge 20 ]; then
                echo "crates.io did not index a dependency of ${name}" >&2
                return "$status"
              fi
              attempt=$((attempt + 1))
              sleep 15
            done
          }
          for name in tcc-ir tcc-state tcc-core tcc-host tcc-host-sqlite tcc-rust-frontend; do
            publish "$name"
          done
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish npm packages
        run: |
          set -euo pipefail
          # setup-node writes an auth-token line. Leave it unset so npm uses
          # the release environment's trusted publisher.
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            grep -v '_authToken' "$NPM_CONFIG_USERCONFIG" > "$NPM_CONFIG_USERCONFIG.clean"
            mv "$NPM_CONFIG_USERCONFIG.clean" "$NPM_CONFIG_USERCONFIG"
          fi
          npm install -g npm@11
          publish() {
            local pkg="$1"
            local output status
            # A path with a slash and no leading ./ is a GitHub repo spec to npm.
            test -f "$pkg"
            set +e
            output=$(npm publish "./$pkg" --access public 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              return 0
            fi
            if printf '%s\n' "$output" | grep -Eiq 'previously published|EPUBLISHCONFLICT'; then
              return 0
            fi
            return "$status"
          }
          publish dist-packages/tcc-engine-frontend-typescript-26.10.4.tgz
          publish dist-packages/tcc-engine-bindings-javascript-26.10.4.tgz
      - name: Stage the wheels
        run: |
          mkdir -p dist
          cp dist-packages/tcc_engine-*.whl dist/
      - name: Publish the Python wheel
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: false
          skip-existing: true
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            - `child_result` requires `child_execution_id`. The engine resumes a plain invoke only when it matches the waiting child, and a join only when the branch and that branch's child both match. A mismatch does not change the continuation.
            - `child_failed` delivers a failed child. A plain invoke throws the message, so a handler can catch it. A join fails that branch under the existing all-join and race rules.
            - `cancel` is rejected for a continuation that is already completed, failed, or cancelled.
            - `engine_format_version` and `host_protocol_version` stay 1. Continuation bytes are unchanged. Rust callers that construct `ChildResult` must pass the child id.
            - The Business Source License parameters name this Licensed Work as TCC Engine 26.10.4. The Change Date remains 2030-10-01.
          files: dist-packages/**
