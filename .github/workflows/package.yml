name: package

on:
  workflow_dispatch:
  workflow_call:

jobs:
  sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: llvm-tools-preview
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install license tools
        run: |
          cargo install cargo-deny --version 0.18.9 --locked
          cargo install cargo-about --version 0.6.6 --locked
      - name: Check dependency licenses
        run: python3 scripts/licenses/collect.py --deny-only --manifest Cargo.toml
      - name: Package Rust crates
        run: bash scripts/package-crates.sh
      - run: mkdir -p dist-packages
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tcc-engine/frontend-typescript build
      - run: pnpm --filter @tcc-engine/frontend-typescript exec npm pack --pack-destination "$GITHUB_WORKSPACE/dist-packages"
      - name: Authoring package carries no binary notices
        run: python3 scripts/licenses/check_archive.py frontend dist-packages/tcc-engine-frontend-typescript-26.10.2.tgz
      - name: Pack the JavaScript binding
        run: |
          cargo build -p tcc-wasm --target wasm32-unknown-unknown --release
          stage="$(mktemp -d)"
          python3 scripts/licenses/collect.py \
            --skip-deny \
            --manifest Cargo.toml \
            --exclude tcc-core \
            --exclude tcc-ir \
            --exclude tcc-state \
            --exclude tcc-host \
            --exclude tcc-host-sqlite \
            --exclude tcc-rust-frontend \
            --exclude tcc-python \
            --exclude tcc-wasm \
            --out "$stage" \
            --bin target/wasm32-unknown-unknown/release/tcc_wasm.wasm
          cp LICENSE bindings/javascript/LICENSE
          cp "$stage/THIRD_PARTY_LICENSES" bindings/javascript/THIRD_PARTY_LICENSES
          rm -rf bindings/javascript/licenses
          mkdir -p bindings/javascript/licenses
          if [ -d "$stage/licenses/third-party" ]; then
            cp -R "$stage/licenses/third-party" bindings/javascript/licenses/third-party
          fi
          pnpm --filter @tcc-engine/bindings-javascript exec npm pack --pack-destination "$GITHUB_WORKSPACE/dist-packages"
      - name: Inspect the wasm package
        run: python3 scripts/licenses/check_archive.py wasm dist-packages/tcc-engine-bindings-javascript-26.10.2.tgz
      - name: Install packed npm packages
        run: |
          mkdir -p /tmp/tcc-npm
          npm install --prefix /tmp/tcc-npm "$GITHUB_WORKSPACE"/dist-packages/tcc-engine-frontend-typescript-26.10.2.tgz
          npm install --prefix /tmp/tcc-npm "$GITHUB_WORKSPACE"/dist-packages/tcc-engine-bindings-javascript-26.10.2.tgz
          cd /tmp/tcc-npm
          node --input-type=module -e "import('@tcc-engine/frontend-typescript').then(m => { if (m.PACKAGE_VERSION !== '26.10.2') process.exit(1) })"
      - name: Stage crate packages
        run: cp target/package/*.crate dist-packages/
      - uses: actions/upload-artifact@v6
        with:
          name: tcc-sources
          path: dist-packages/

  wheels:
    name: wheel-${{ matrix.slot }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CIBW_ARCHS: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            slot: linux-x64
          - os: ubuntu-24.04-arm
            slot: linux-arm64
          - os: macos-14
            slot: darwin-arm64
          - os: macos-15-intel
            slot: darwin-x64
          - os: windows-latest
            slot: win32-x64
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheels
        run: |
          python -m pip install 'cibuildwheel>=2.21,<3'
          stage="$(mktemp -d)"
          python scripts/licenses/stage_wheel.py "$stage"
          # Linux copies the working directory into the container. The staged tree has to be that directory.
          (
            cd "$stage"
            python -m cibuildwheel --output-dir "$GITHUB_WORKSPACE/wheelhouse" .
          )
      - name: Inspect the wheels
        run: |
          shopt -s nullglob
          wheels=(wheelhouse/tcc_engine-*.whl)
          if [ "${#wheels[@]}" -ne 3 ]; then
            echo "expected CPython 3.10, 3.11, and 3.12 wheels, found ${#wheels[@]}" >&2
            printf '%s\n' "${wheels[@]}" >&2
            exit 1
          fi
          for wheel in "${wheels[@]}"; do
            python scripts/licenses/check_archive.py wheel "$wheel"
          done
      - name: Install a CPython 3.12 wheel
        if: matrix.slot == 'linux-x64'
        run: |
          python -m venv /tmp/tcc-py
          /tmp/tcc-py/bin/pip install wheelhouse/tcc_engine-*-cp312-*.whl
          /tmp/tcc-py/bin/python -c "import tcc_engine; assert tcc_engine.PACKAGE_VERSION == '26.10.2'"
      - uses: actions/upload-artifact@v6
        with:
          name: tcc-wheels-${{ matrix.slot }}
          path: wheelhouse/*.whl

  package:
    needs: [sources, wheels]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: tcc-sources
          path: dist-packages
      - uses: actions/download-artifact@v7
        with:
          pattern: tcc-wheels-*
          path: wheel-artifacts
          merge-multiple: true
      - name: Combine the package set
        run: |
          shopt -s nullglob
          cp wheel-artifacts/*.whl dist-packages/
          test -f dist-packages/tcc-engine-frontend-typescript-26.10.2.tgz
          test -f dist-packages/tcc-engine-bindings-javascript-26.10.2.tgz
          crates=(dist-packages/*.crate)
          if [ "${#crates[@]}" -ne 6 ]; then
            echo "expected six crate packages, found ${#crates[@]}" >&2
            exit 1
          fi
          wheels=(dist-packages/tcc_engine-*.whl)
          if [ "${#wheels[@]}" -ne 15 ]; then
            echo "expected 15 wheels, found ${#wheels[@]}" >&2
            printf '%s\n' "${wheels[@]}" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: tcc-engine-26.10.2
          path: dist-packages/
