name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build -p tcc-wasm --target wasm32-unknown-unknown --release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tcc-engine/frontend-typescript test

  wasm-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: cargo build -p tcc-wasm --target wasm32-unknown-unknown --release
      - run: cargo build -p tcc-rust-frontend --release
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tcc-engine/bindings-javascript build
      - run: pnpm --filter @tcc-engine/bindings-javascript typecheck
      - run: pnpm --filter @tcc-engine/host-node typecheck
      - run: node --experimental-strip-types --test bindings/javascript/src/index.test.ts hosts/node-memory/src/host.test.ts
      - run: pnpm --filter @tcc-engine/host-node test

  rust-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: cargo build -p tcc-host-sqlite
      - run: cargo build -p tcc-rust-frontend --release
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-sqlite --experimental-strip-types conformance/run.ts --driver conformance/drivers/rust-sqlite.ts

  ordinary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: cargo build -p tcc-wasm --target wasm32-unknown-unknown --release
      - run: cargo build -p tcc-core --bin tcc-drive --release
      - run: cargo test -p tcc-rust-frontend
      - run: cargo build -p tcc-rust-frontend --release
      - run: python -m venv .venv
      - run: .venv/bin/pip install maturin
      - run: ${{ github.workspace }}/.venv/bin/maturin develop
        working-directory: bindings/python
      - name: score ordinary corpus
        working-directory: ${{ github.workspace }}
        env:
          PATH: ${{ github.workspace }}/.venv/bin:${{ env.PATH }}
        run: node --experimental-strip-types conformance/ordinary/score.ts
      - name: cross-language invoke
        working-directory: ${{ github.workspace }}
        env:
          PATH: ${{ github.workspace }}/.venv/bin:${{ env.PATH }}
        run: node --experimental-strip-types conformance/cross-language.ts

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: cargo build -p tcc-wasm --target wasm32-unknown-unknown --release
      - run: cargo build -p tcc-rust-frontend --release
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tcc-engine/bindings-javascript build
      - run: python -m venv .venv
      - run: .venv/bin/pip install maturin pytest
      - run: ${{ github.workspace }}/.venv/bin/maturin develop
        working-directory: bindings/python
      - run: .venv/bin/pytest frontends/python hosts/python

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack:js
      - run: python -m venv .venv
      - run: .venv/bin/pip install maturin
      - run: ${{ github.workspace }}/.venv/bin/maturin build --release --out ${{ github.workspace }}/dist-packages
        working-directory: bindings/python
      - run: node --experimental-sqlite scripts/verify-local-packages.mjs
      - run: .venv/bin/python scripts/verify-local-wheel.py
      - uses: actions/upload-artifact@v6
        with:
          name: engine-packages-26.10.2
          path: dist-packages/*
